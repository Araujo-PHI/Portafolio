<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Profesional - Araujo PHI</title>
    <!-- Vinculación del CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="window-container">
        <!-- Barra superior estilo ventana -->
        <div class="window-header">
            <span class="dot blue"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
        </div>

        <main class="profile-container">
            <!-- Header / Perfil -->
            <section class="profile-header">
                <div class="avatar-container">
                    <img src="images/profile.png" class="avatar-container">
                </div>
                <div class="profile-info">
                    <h1>Araujo PHI</h1>
                    <p class="subtitle">Este es mi portafolio personal de proyectos.</p>
                    <div class="social-buttons">
                        <a href="https://github.com/Araujo-PHI" target="_blank" class="btn-icon" title="GitHub"><i class="fa-brands fa-github"></i></a>
                        <a href="https://discord.com/users/1276323402499756064" target="_blank" class="btn-icon" title="Discord"><i class="fa-brands fa-discord"></i></a>
                    </div>
                </div>
            </section>

            <!-- Sobre mí -->
            <section class="section">
                <h2>Sobre mí</h2>
                <p class="description-text">Soy Araujo PHI, me gusta el mundo de la IA, la programación y el futbol. Estoy aprendiendo muchas cosas nuevas, conociendo ideas, y mi manera de pensar todo el tiempo va moviendose de aqui para alla.
            </section>

            <!-- Proyectos -->
            <section class="section">
                <h2>Proyectos</h2>
                <div id="projects-container" class="projects-grid"></div>
            </section>

            <!-- Footer / Redes inferior -->
            <footer class="profile-footer">
                <p>Araujo PHI</p>
            </footer>
        </main>
    </div>

    <!-- Vinculación del JavaScript -->
    <script src="script.js"></script>
</body>
</html>

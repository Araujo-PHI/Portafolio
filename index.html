<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AraujoXYZ - Portafolio</title>
    <!-- Fuentes tipográficas modernas UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado / Perfil -->
    <header class="hero">
        <div class="container">
            <h1 class="user-name">AraujoPHI</h1>
            
            <div class="about-grid">
                <div class="card-info">
                    <h3>Un poco de mí</h3>
                    <p>Diseño y desarrollo experiencias web interactivas, aplicaciones y prototipos digitales enfocados en usabilidad y diseño moderno.</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Sección Principal de Proyectos -->
    <main class="container">
        <!-- El JS cargará y agrupará aquí los proyectos por año -->
        <div id="projects-container">
            <p class="loading-text">Cargando proyectos desde config.txt...</p>
        </div>
    </main>

    <!-- Modal Flotante con Animación para Previsualización -->
    <div id="project-modal" class="modal">
        <div class="modal-header">
            <span id="modal-title" class="modal-title">Vista del Proyecto</span>
            <div class="modal-actions">
                <a id="modal-download-btn" href="#" download class="btn-download" style="display: none;">Descargar HTML</a>
                <button id="modal-close-btn" class="btn-close">Cerrar</button>
            </div>
        </div>
        <div class="modal-body">
            <iframe id="modal-iframe" src="" title="Vista previa completa"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
